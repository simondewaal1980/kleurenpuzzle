# JVM-instellingen voor de Gradle-daemon (het achtergrondproces dat builds doet).
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Hergebruik build-resultaten van eerdere builds (sneller).
org.gradle.caching=true
# Gradle 9 werkt standaard met de configuration cache; dat is sneller.
org.gradle.configuration-cache=true
# AndroidX is de moderne Android-bibliotheekstructuur.
android.useAndroidX=true
# Elke module krijgt alleen zijn eigen R-class (kleinere builds).
android.nonTransitiveRClass=true
# Officiële Kotlin-stijl (4 spaties inspringen).
kotlin.code.style=official

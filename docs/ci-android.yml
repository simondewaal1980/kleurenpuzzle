name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK-pakketten installeren
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle uitvoerbaar maken
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :format:test :pipeline:test :app:testDebugUnitTest --console=plain

      - name: Debug-APK bouwen
        run: ./gradlew :app:assembleDebug --console=plain

      - name: APK bewaren
        uses: actions/upload-artifact@v4
        with:
          name: kleuren-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
